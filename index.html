<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#f5f3ee" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#161b21" media="(prefers-color-scheme: dark)" />
    <meta name="description" content="Jogo educativo de biologia pensado para pessoas com TEA." />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <title>BioTEA</title>
    <script>
      (function () {
        var c = { calmo: false, texto: "normal", voz: false, contraste: false, aparencia: "sistema" };
        try { Object.assign(c, JSON.parse(localStorage.getItem("biotea:config")) || {}); } catch (e) {}
        var h = document.documentElement;
        h.dataset.calmo = c.calmo ? "sim" : "nao";
        h.dataset.texto = c.texto;
        h.dataset.contraste = c.contraste ? "alto" : "normal";
        h.dataset.voz = c.voz ? "sim" : "nao";
        h.dataset.aparencia = c.aparencia;
      })();
    </script>
  </head>
  <body>
    <div id="raiz"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
